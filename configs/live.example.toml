[paths]
store_path = 'data\project_lux_live.sqlite3'
input_csv = ''

[strategy]
# The frozen CCF/UMC parameters: 1m bars, window 2500, enter at 1.5, exit at 0.
entry_z = 1.5
exit_z = 0.0
initial_capital_twd = 2000000.0
max_entry_delay_minutes = 15
zscore_window = 2500
# fixed_lots | notional. Fixed lots is the default and what actually trades.
sizing_mode = 'fixed_lots'
ccf_lots = 1
# flat | no-entry | none. 'none' (the default) is correct for CCF/UMC: TAIFEX
# and NYSE both close over the weekend, so neither the last-session entry ban
# nor the force-close applies. Only the legacy QFF/TSM fixture uses 'flat'.
weekend_policy = 'none'

[fees]
# Placeholder. IBKR bills per share + SEC/FINRA + a minimum, which bps cannot
# express; the real model arrives with the Phase D execution adapter.
umc_fee_bps = 2.5
# TODO: QFF's 88 TWD/contract reused. CCF's actual Fubon fee is unconfirmed.
ccf_fee_per_contract_twd = 88.0
ccf_tax_rate = 0.00002
# REQUIRED, no default: CCF is 2,000 shares per contract. QFF was 100. Getting
# this wrong sizes every position twenty times off, self-consistently, so
# nothing downstream would flag it.
ccf_contract_multiplier = 2000.0
# UMC's ADR ratio: one ADR is 5 ordinary shares, the same ratio that converts
# the US price into a TWD-fair spread leg.
umc_contract_multiplier = 5.0

[safety]
allow_live_order = false
validate_expected_zscore = false
expected_zscore_tolerance = 0.0000001

[contract_policy]
enabled = true
min_business_days_to_expiry = 5
force_exit_business_days_before_expiry = 1
force_exit_grace_minutes = 5
holidays = []

[trading_calendar]
# 2026 TAIFEX futures market non-trading weekdays.
# Source: https://www.taifex.com.tw/file/taifex/CHINESE/4/2026Calendar.pdf
closed_dates = [
  '2026-01-01',
  '2026-02-12',
  '2026-02-13',
  '2026-02-16',
  '2026-02-17',
  '2026-02-18',
  '2026-02-19',
  '2026-02-20',
  '2026-02-27',
  '2026-04-03',
  '2026-04-06',
  '2026-05-01',
  '2026-06-19',
  '2026-09-25',
  '2026-09-28',
  '2026-10-09',
  '2026-10-26',
  '2026-12-25',
]

[live_market_data]
polling_seconds = 1.0
minute_finalize_delay_seconds = 1.0
stale_seconds = 10.0
ccf_book_stale_seconds = 55.0
sync_windows_time_on_startup = true
clock_skew_fail_seconds = 60.0
windows_time_sync_timeout_seconds = 15.0
max_leg_timestamp_skew_seconds = 10.0
# Matches zscore_window. 2500 minutes on the TAIFEX-and-RTH intersection is
# about 6.4 UMC sessions, i.e. ~9 calendar days -- inside both the TAIFEX 30-day
# rolling window and IBKR's history reach.
warmup_minutes = 2500
warmup_ccf_max_trailing_fill_minutes = 5
ccf_product = 'CCF'
ccf_symbol = 'auto'
umc_symbol = 'UMC'
fx_symbol = 'USD/TWD'
fubon_env_path = '.env'
taifex_use_network = true
taifex_cache_dir = 'data\taifex_cache'
taifex_ccf_1m_csv = 'D:\Users\Documents\Proof of Concept\data\processed\ccf1_1m_cumulative.csv'

# -- Clock-skew gate ---------------------------------------------------------
# Checked against NTP, not a venue. The loop labels bars off the local clock and
# measures staleness against three feeds at once, so what has to be correct is
# absolute time -- and this still works when the IB Gateway is at its daily
# login screen, which is exactly when a startup gate must run. Tried in order;
# the first to answer wins. Measured 2026-07-29: 29-59ms round trip.
ntp_servers = ['time.stdtime.gov.tw', 'tock.stdtime.gov.tw', 'pool.ntp.org']
ntp_timeout_seconds = 5.0

# -- IBKR (UMC) --------------------------------------------------------------
ibkr_host = '127.0.0.1'
ibkr_port = 4001
ibkr_client_id = 17002
# 1 live | 2 frozen | 3 delayed | 4 delayed-frozen. Keep 1: requesting 3
# OVERRIDES a real-time entitlement, and the delayed tier serves no book, so the
# directional signal could never fire on it anyway.
ibkr_market_data_type = 1

# -- Twelve Data (USD/TWD) ---------------------------------------------------
# 78 requests per UMC session against a free tier of 800/day.
fx_cache_ttl_seconds = 300.0
# The FX reference is polled on a cache TTL, not co-timed with the legs, so it
# gets its own budget rather than the 10s one above.
fx_stale_seconds = 600.0
fx_max_serve_seconds = 900.0

[broker_reconciliation]
enabled = false
fail_on_mismatch = false
umc_units_tolerance = 0.000001
ccf_contract_tolerance = 0

[live_execution]
enabled = false
require_readonly_reconciliation = true
max_plan_age_seconds = 120
ccf_first = true

[margin_management]
# Semi-automatic dual-account margin policy (PoC margin_management_analysis).
# The system only computes and reports transfer guidance; transfers and closes
# stay manual. Requires LUX_READONLY_BROKER=1 at runtime.
enabled = false
check_time = '10:00'
red_line_interval_minutes = 15
umc_transfer_ratio = 0.11
umc_red_line_ratio = 0.05
fubon_transfer_ratio = 0.20
fubon_red_line_ratio = 0.135
target_ratio = 0.30
red_line_maint_multiplier = 1.3
# 0 falls back to strategy.leg_notional_twd
leg_notional_twd = 0.0

[ntfy]
# Best-effort live notifications. Public ntfy.sh topic names should be hard to
# guess. --quiet-ui only hides terminal output and does not disable ntfy.
enabled = false
server_url = 'https://ntfy.sh'
status_topic = ''
trades_topic = ''
errors_topic = ''
request_timeout_seconds = 3.0
