# Multi-pair dry-run: QFF/TSM alongside CCF/UMC in one process, no real orders.
# NOTE: this file IS tracked by git despite its name. Credentials live in .env,
# never here.
#
# Run both pairs:
#   .\scripts\lux.ps1 live --mode dry-run --config configs\config.multipair.dryrun.local.toml --reset-store
# Or a single pair:
#   ... live --config ... --pair ccf_umc:dry-run --reset-store
#
# Machine constraints (see docs/CODEX_DELEGATION_WORKFLOW.md):
#   - CCF and QFF quotes share ONE Fubon SDK session; running this while the
#     other machine's live-execute is up will kick that session. Stop it first.
#   - The CCF/UMC pair needs IB Gateway running (live account, port 4001).
#     Without the NYSE subscription IBKR serves ~15-minute delayed data --
#     us_leg.stale_seconds below admits it, and the runtime banner keeps
#     repeating that the signals cannot be trusted until subscribed.

[paths]
store_path = 'data\project_lux_multipair_dryrun.sqlite3'

# ---------------------------------------------------------------------------
[[pairs]]
id = 'qff_tsm'
label = 'QFF/TSM'
# weekend_policy omitted: defaults to 'flat', the measured-necessary rule for a
# pair whose US leg trades through the weekend.

[pairs.data]
input_csv = 'D:\Users\Documents\Proof of Concept\data\processed\qff_tsm_spread_zscore_1m_taipei_qff_session_w500.csv'
tw_leg_ohlcv_csv = 'D:\Users\Documents\Proof of Concept\data\processed\qff1_1m.csv'
us_leg_ohlcv_csv = 'D:\Users\Documents\Proof of Concept\data\processed\binance_tsmusdtp_1m_taipei.csv'
fx_ohlcv_csv = 'D:\Users\Documents\Proof of Concept\data\processed\bitopro_usdttwd_1m_taipei.csv'

[pairs.tw_leg]
display = 'QFF'
venue = 'fubon'
product = 'QFF'
symbol = 'auto'
contract_multiplier = 100.0
taifex_1m_csv = 'D:\Users\Documents\Proof of Concept\data\processed\qff1_1m.csv'

[pairs.us_leg]
display = 'TSM'
venue = 'binance'
symbol = 'TSM/USDT:USDT'
adr_share_ratio = 5.0

[pairs.fx]
venue = 'bitopro'
symbol = 'USDT/TWD'

[pairs.sizing]
mode = 'fixed_lots'
lots = 1

[pairs.strategy]
entry_z = 2.0
exit_z = 1.0
initial_capital_twd = 2000000.0
max_entry_delay_minutes = 15
zscore_window = 500

[pairs.fees]
us_leg_fee_bps = 5.0
tw_leg_fee_per_contract_twd = 88.0
tw_leg_tax_rate = 0.00002

# ---------------------------------------------------------------------------
[[pairs]]
id = 'ccf_umc'
label = 'CCF/UMC'
# §5.3 of docs/MULTIPAIR_PLAN.md: both markets freeze over the weekend, so the
# weekend rules are a mis-transplanted constraint here. Measured +19.7% net
# with identical max drawdown across three sampling frequencies.
weekend_policy = 'none'
# Pair-level warmup window (decision 2026-07-24: independent from
# zscore_window). 2500 x 1m bars on the TAIFEX∩UMC-RTH intersection
# ≈ 6.4 UMC sessions ≈ 9 calendar days; the TAIFEX 30-day rolling window and
# the 14-day fetch lookback both cover it.
warmup_minutes = 2500

[pairs.data]
input_csv = 'D:\Users\Documents\Proof of Concept\data\processed\wk_none_zscore.csv'

[pairs.tw_leg]
display = 'CCF'
venue = 'fubon'
product = 'CCF'
symbol = 'auto'
# §8.1: 2,000 shares per contract -- twenty times QFF's 100. THE highest-risk
# constant in the whole rework; covered by dedicated tests.
contract_multiplier = 2000.0
taifex_1m_csv = 'D:\Users\Documents\Proof of Concept\data\processed\ccf1_1m_cumulative.csv'

[pairs.us_leg]
display = 'UMC'
venue = 'ibkr'
symbol = 'UMC'
adr_share_ratio = 5.0
# Delayed-feed admission (no NYSE subscription yet): IBKR stamps quotes with the
# honest ~15-minute-delayed source time. REMOVE this line once the real-time
# subscription is active so the strict global budget applies again.
stale_seconds = 1200.0

[pairs.fx]
venue = 'twelvedata'
symbol = 'USD/TWD'
# 78 requests per UMC session against a 800/day free tier (measured 2026-07-24).
cache_ttl_seconds = 300.0
# Worst case measured: 300s cache + ~35s publish lag = ~335s. 600 leaves ~1.8x
# headroom while still catching a genuinely dead feed inside ten minutes.
stale_seconds = 600.0

[pairs.sizing]
mode = 'fixed_lots'
lots = 1

[pairs.strategy]
entry_z = 1.5
exit_z = 0.0
initial_capital_twd = 2000000.0
max_entry_delay_minutes = 15
zscore_window = 2500

[pairs.fees]
# UMC via IBKR: bps是佔位 -- IBKR real costs are per-share + minimum + SEC/FINRA
# fees; the fee-model extension is Phase 3 work (open item 1b).
us_leg_fee_bps = 2.5
# TODO: 88.0 is QFF's per-contract fee reused as a placeholder. CCF's actual
# Fubon fee is unconfirmed (open item #2 in docs/MULTIPAIR_PLAN.md §9).
tw_leg_fee_per_contract_twd = 88.0
tw_leg_tax_rate = 0.00002

# ---------------------------------------------------------------------------
[safety]
allow_live_order = false
validate_expected_zscore = true
expected_zscore_tolerance = 0.0000001

[contract_policy]
enabled = true
min_business_days_to_expiry = 5
force_exit_business_days_before_expiry = 1
force_exit_time = '13:35'
holidays = []

[trading_calendar]
# 2026 TAIFEX futures market non-trading weekdays.
# Source: https://www.taifex.com.tw/file/taifex/CHINESE/4/2026Calendar.pdf
closed_dates = [
  '2026-01-01',
  '2026-02-12',
  '2026-02-13',
  '2026-02-16',
  '2026-02-17',
  '2026-02-18',
  '2026-02-19',
  '2026-02-20',
  '2026-02-27',
  '2026-04-03',
  '2026-04-06',
  '2026-05-01',
  '2026-06-19',
  '2026-09-25',
  '2026-09-28',
  '2026-10-09',
  '2026-10-26',
  '2026-12-25',
]

[live_market_data]
polling_seconds = 1.0
minute_finalize_delay_seconds = 1.0
stale_seconds = 10.0
tw_leg_book_stale_seconds = 55.0
sync_windows_time_on_startup = true
clock_skew_fail_seconds = 60.0
windows_time_sync_timeout_seconds = 15.0
max_leg_timestamp_skew_seconds = 10.0
warmup_minutes = 500
warmup_forward_fill_max_ratio = 0.9
warmup_tw_leg_max_trailing_fill_minutes = 5
fubon_env_path = 'env'
taifex_use_network = true
taifex_cache_dir = 'data\taifex_cache'

[broker_reconciliation]
enabled = false
fail_on_mismatch = false
us_leg_units_tolerance = 0.000001
tw_leg_contract_tolerance = 0

[live_execution]
enabled = false
require_readonly_reconciliation = true
max_plan_age_seconds = 120
tw_leg_first = true

[binance_execution]
leverage = 1
margin_mode = 'cross'
enforce_leverage = true

[margin_management]
enabled = true
check_time = '10:00'
red_line_interval_minutes = 240
binance_transfer_ratio = 0.11
binance_red_line_ratio = 0.05
fubon_transfer_ratio = 0.20
fubon_red_line_ratio = 0.135
target_ratio = 0.30
red_line_maint_multiplier = 1.3
leg_notional_twd = 0.0

[ntfy]
enabled = true
server_url = 'https://ntfy.sh'
status_topic = 'status-43cc9'
trades_topic = 'trades-91c91'
errors_topic = 'errors-1836f'
request_timeout_seconds = 3.0
