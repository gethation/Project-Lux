# CCF/UMC LIVE EXECUTE — this file sends REAL two-leg orders.
#
# It is the strategy at its real threshold (entry_z 1.5), one lot, both venues.
# Everything in it is copied from the soak config that has actually run, with
# only the gates and the store changed. Do not tune it and run it the same
# night: the soak numbers stop applying the moment you do.
#
# ---------------------------------------------------------------------------
# WHAT THIS CANNOT DO ON ITS OWN
#
# The config is one of four locks. Starting live-execute also needs:
#
#   1. env  PROJECT_LUX_ALLOW_LIVE_ORDER=1
#   2. env  FUBON_ALLOW_LIVE_ORDER=1
#   3. env  IBKR_ALLOW_LIVE_ORDER=1
#   4. a MATCHED read-only reconciliation, refreshed at startup, with no
#      unexpected positions and no open orders at either broker
#
# `scripts/lux.ps1 live --mode execute` sets the three env vars for you. That is
# convenient and it means the shell you launch from is armed -- know that.
#
# ---------------------------------------------------------------------------
# WHAT HAS NEVER BEEN TESTED, AND THIS FILE IS THE FIRST THING THAT WILL
#
#   * both legs at once. Every real order so far has been ONE leg at ONE venue,
#     so "CCF filled, UMC unknown" -- the state that leaves a naked leg -- has
#     never happened. ccf_first=true means CCF is the leg already filled when
#     it does.
#   * `unknown` -> PAUSE. Only ever exercised against fakes.
#   * the automatic emergency close in RealExecutionCoordinator, which fires on
#     a half-filled pair. If it also fails you get
#     `critical_manual_intervention_required` and the position sits until a
#     human acts.
#
# Run it attended. See docs/HANDOFF.md.
# ---------------------------------------------------------------------------

[paths]
# Live does not read input_csv, but config load requires the key.
input_csv = 'tests/fixtures/replay/ccf_umc_spread_zscore_w2500.csv'
# Its own store. Never point this at a soak's database: the live-execute gate
# reads the latest reconciliation from here, and a dry run's report would let
# real orders start on evidence that was never about real positions.
store_path = 'data/live_ccf_umc_execute.sqlite3'
ccf_ohlcv_csv = 'tests/fixtures/replay/ccf1_1m_open.csv'
umc_ohlcv_csv = 'tests/fixtures/replay/umc_1m_open.csv'
usd_twd_ohlcv_csv = 'tests/fixtures/replay/usd_twd_1m_open.csv'

[strategy]
# The real thresholds. The 0.3 used in the coverage soak was for exercising the
# order path, and every number that run produced is meaningless here.
entry_z = 1.5
exit_z = 0.0
zscore_window = 2500
leg_notional_twd = 1000000.0
initial_capital_twd = 2000000.0
max_entry_delay_minutes = 15
weekend_policy = 'none'

# ONE lot, and that is a hard limit of the account, not a choice.
# A lot is ~2000 x CCF price ~= 232,500 TWD, hedged by ~400 UMC shares
# (~7.4k USD) against 5,653 USD of equity -- about 1.30x, inside Reg T initial
# margin at 50%. TWO lots need 7,364 USD of initial margin and do not fit.
# Raising ccf_lots without adding capital gets the second leg rejected AFTER
# the first one fills.
sizing_mode = 'fixed_lots'
ccf_lots = 1

[fees]
umc_fee_bps = 2.5
# What IBKR actually bills: per share, a per-order minimum, a 1% cap that
# overrides the minimum, and SEC/FINRA on SELLS only. Reachable from the live
# path since 2026-08-04 and exercised on both sides.
umc_fee_model = 'ibkr'
# TODO before this matters: 88.0 is QFF's per-contract fee, reused as a
# placeholder. CCF's real Fubon fee is unconfirmed.
ccf_fee_per_contract_twd = 88.0
ccf_tax_rate = 0.00002
# 2000 shares/contract. QFF was 100. A wrong value here is a 20x position error
# with self-consistent arithmetic downstream and no symptom.
ccf_contract_multiplier = 2000.0
umc_contract_multiplier = 5.0

[safety]
# LOCK 1 OF 4.
allow_live_order = true
# Off: the live path computes its own z-score from live quotes and has nothing
# to compare against. This is a replay-only assertion.
validate_expected_zscore = false
expected_zscore_tolerance = 0.0000001

[live_execution]
# LOCK 2 OF 4.
enabled = true
# CCF first, and the gate refuses to start if this is false. The order matters:
# whichever leg goes first is the one left naked if the second fails, and CCF
# on TAIFEX can be closed out in its own day session while a stranded UMC short
# accrues borrow cost every day it is open.
ccf_first = true
# LOCK 4 OF 4. Do not set this false to get started -- it is what stops the
# loop trading on top of a position it does not know about.
require_readonly_reconciliation = true
# A plan older than this is refused rather than sent. Two minutes is already
# generous for a market order.
max_plan_age_seconds = 120

[broker_reconciliation]
# Compares broker positions against the store before and during the run.
enabled = true
fail_on_mismatch = true
umc_units_tolerance = 0.000001
ccf_contract_tolerance = 0

[contract_policy]
enabled = true
min_business_days_to_expiry = 5
force_exit_business_days_before_expiry = 1
# Rollover force-exit is anchored to pair-session close minus this, NOT to a
# TAIFEX day-session time. The original 13:35 sat in a session this pair never
# trades, so the rule could never fire. Never verified live.
force_exit_grace_minutes = 5
holidays = []

[trading_calendar]
# 2026 TAIFEX non-trading weekdays.
# Source: https://www.taifex.com.tw/file/taifex/CHINESE/4/2026Calendar.pdf
# US market holidays are deliberately NOT modelled: on those days UMC has no
# data, staleness rejects the minute, and no bar is built -- loud but safe.
closed_dates = [
  '2026-01-01',
  '2026-02-12',
  '2026-02-13',
  '2026-02-16',
  '2026-02-17',
  '2026-02-18',
  '2026-02-19',
  '2026-02-20',
  '2026-02-27',
  '2026-04-03',
  '2026-04-06',
  '2026-05-01',
  '2026-06-19',
  '2026-09-25',
  '2026-09-28',
  '2026-10-09',
  '2026-10-26',
  '2026-12-25',
]

[live_market_data]
polling_seconds = 1.0
minute_finalize_delay_seconds = 1.0

# Three sources, three cadences, three budgets. Measured over 17,417 polls on
# 2026-08-04; do not collapse them into one number.
#
# UMC book: p50 0.0s, max 3.3s.
stale_seconds = 10.0
# UMC's last TRADE, which is what the bar's close is built from. The quote is
# stamped with the BOOK clock, so stale_seconds does not bound this. One bar
# period: the correct close of a quiet minute IS the last trade in it.
umc_trade_stale_seconds = 60.0
# CCF book. CCF updates about once every five polls and can sit unchanged for
# 99. An old CCF timestamp means nothing traded, not that the price is wrong.
ccf_book_stale_seconds = 55.0
# USD/TWD arrives from a 300s vendor cache: p50 193s, max 391s. NOTHING was
# ever within 10s. Measured drift at 300-600s staleness is 0.045% p90, which is
# 0.036 z -- a fifth of the execution haircut. Re-measure if FX turns volatile.
max_leg_timestamp_skew_seconds = 10.0

warmup_minutes = 2500
warmup_forward_fill_max_ratio = 0.9
warmup_ccf_max_trailing_fill_minutes = 5

sync_windows_time_on_startup = true
clock_skew_fail_seconds = 60.0
windows_time_sync_timeout_seconds = 15.0

ccf_product = 'CCF'
ccf_symbol = 'auto'
umc_symbol = 'UMC'
fx_symbol = 'USD/TWD'
# This machine keeps credentials in `.env`, not `env`. load_dotenv() returns
# silently on a missing path, so a wrong value here surfaces much later as a
# missing FUBON_PERSONAL_ID.
fubon_env_path = '.env'

ibkr_host = '127.0.0.1'
ibkr_port = 4001
ibkr_client_id = 17002
# 1 = live. Requesting 3 (delayed) OVERRIDES an entitlement the account holds,
# and the delayed tier serves no book -- so the directional z-score would never
# produce an entry and the loop would run all night trading nothing.
ibkr_market_data_type = 1

taifex_use_network = true
taifex_cache_dir = 'data/taifex_cache'
# Fallback only; the builder prefers Fubon's intraday candles. This file is
# accumulated MANUALLY and goes stale -- unattended running needs a scheduler.
taifex_ccf_1m_csv = 'D:\Users\Documents\Proof of Concept\data\processed\ccf1_1m_cumulative.csv'

[margin_management]
enabled = true
check_time = '10:00'
red_line_interval_minutes = 240
umc_transfer_ratio = 0.11
umc_red_line_ratio = 0.05
fubon_transfer_ratio = 0.20
fubon_red_line_ratio = 0.135
target_ratio = 0.30
red_line_maint_multiplier = 1.3
# 0 derives the denominator from ccf_lots and the latest CCF price.
leg_notional_twd = 0.0

[ntfy]
# ON, and this is not optional for a live run. The error topic is the only
# thing that reaches a phone. Terminal output does not wake anyone, and the
# state that needs a human -- a half-filled pair whose automatic emergency
# close also failed -- can happen at 03:00.
enabled = true
server_url = 'https://ntfy.sh'
status_topic = 'status-43cc9'
trades_topic = 'trades-91c91'
errors_topic = 'errors-1836f'
request_timeout_seconds = 3.0
