# LEGACY QFF/TSM replay config, pinned to the committed fixture snapshot under
# tests/fixtures/replay/. Run from the repository root:
#   conda run -n Quant python -m lux_trader replay --config configs/replay.fixture.toml --reset-store
#   conda run -n Quant python -m lux_trader summary --config configs/replay.fixture.toml
#
# Aligned summary: trade_count=66, net_pnl_twd=261507.82918...,
# total_fee_twd=68317.4968...
#
# This is NOT the CCF/UMC strategy -- it is QFF vs Binance TSM, kept only as a
# tripwire proving that the rebuild did not move the numbers. Phase C of
# docs/CCF_UMC_PLAN.md replaces it with a CCF/UMC golden and deletes this file.
[paths]
# input_csv is resolved relative to the current working directory (repo root),
# not the config directory; keep CLI invocations rooted at the repo.
input_csv = 'tests/fixtures/replay/spread_zscore_w500.csv'
store_path = 'data/replay_fixture.sqlite3'
ccf_ohlcv_csv = 'tests/fixtures/replay/qff1_1m_open.csv'
umc_ohlcv_csv = 'tests/fixtures/replay/binance_tsm_open.csv'
usd_twd_ohlcv_csv = 'tests/fixtures/replay/bitopro_usdttwd_open.csv'

[strategy]
entry_z = 2.0
exit_z = 1.0
leg_notional_twd = 1000000.0
initial_capital_twd = 2000000.0
max_entry_delay_minutes = 15
zscore_window = 500
# Explicit: this golden was produced under the weekend rules and only reproduces
# under 'flat'. The project default is 'none'.
weekend_policy = 'flat'
# Likewise: notional sizing, not the project's default single fixed lot.
sizing_mode = 'notional'

[fees]
umc_fee_bps = 5.0
ccf_fee_per_contract_twd = 5.0
ccf_tax_rate = 0.00002
ccf_contract_multiplier = 100.0
umc_contract_multiplier = 5.0

[safety]
allow_live_order = false
validate_expected_zscore = true
expected_zscore_tolerance = 0.0000001
